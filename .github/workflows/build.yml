name: Build MiniWatts Vietnamese Widget

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Get MiniWatts source
        run: |
          git clone --depth 1 https://github.com/ResistanceTo/MiniWatts.git source

      - name: Patch widget and Vietnamese UI
        working-directory: source
        shell: python3 {0}
        run: |
          from pathlib import Path
          import json
          import re

          # ============================================================
          # 1. Add temperature values to ChargeReading
          # ============================================================

          p = Path("MiniWatts/Shared/ChargeReading.swift")
          s = p.read_text()

          s = s.replace(
              "var batteryTemperature: Double?",
              """var batteryTemperature: Double?
              var socTemperature: Double?
              var chargerTemperature: Double?
              var hottestTemperature: Double?
              var hottestSensorName: String?"""
          )

          s = s.replace(
              "batteryTemperature = snapshot.batteryTemperature",
              """batteryTemperature = snapshot.batteryTemperature
              socTemperature = snapshot.temperaturesByZone.first(where: { $0.zone == .soc })?.representative
              chargerTemperature = snapshot.temperaturesByZone.first(where: { $0.zone == .charger })?.representative
              hottestTemperature = snapshot.hottestSensor?.value
              hottestSensorName = snapshot.hottestSensor?.name"""
          )

          p.write_text(s)

          # ============================================================
          # 2. Replace Medium Home Screen widget
          # ============================================================

          p = Path("Widget/BatteryWidget.swift")
          s = p.read_text()

          new_view = r'''
          struct MediumBatteryView: View {
              let entry: BatteryEntry
              let palette: WidgetPalette

              var body: some View {
                  if let reading = entry.reading {
                      let tint = palette.tint(for: reading)

                      VStack(spacing: 8) {

                          HStack {
                              HStack(spacing: 5) {
                                  Image(systemName: "bolt.fill")
                                      .font(.system(size: 13, weight: .bold))
                                      .foregroundStyle(tint)

                                  Text("Công suất sạc")
                                      .font(.system(size: 14, weight: .semibold))
                                      .foregroundStyle(tint)
                              }

                              Spacer()

                              HStack(spacing: 4) {
                                  Image(systemName: "battery.100percent")
                                      .foregroundStyle(.green)

                                  Text(reading.percent.map { "\($0)%" } ?? "—")
                                      .font(.system(size: 14, weight: .semibold, design: .rounded))
                                      .monospacedDigit()
                                      .foregroundStyle(.green)
                              }
                          }

                          HStack(alignment: .firstTextBaseline, spacing: 3) {
                              if let watts = reading.watts {
                                  Text(Formatting.watts(watts))
                                      .font(.system(size: 32, weight: .semibold, design: .rounded))
                                      .monospacedDigit()
                                      .foregroundStyle(.white)
                              } else {
                                  Text("—")
                                      .font(.system(size: 32, weight: .semibold, design: .rounded))
                                      .foregroundStyle(.white)
                              }

                              Text("W")
                                  .font(.system(size: 14, weight: .medium, design: .rounded))
                                  .foregroundStyle(palette.muted)
                          }
                          .frame(maxWidth: .infinity, alignment: .leading)

                          HStack(spacing: 7) {
                              MetricBox(
                                  title: "SoC",
                                  value: reading.socTemperature,
                                  icon: "cpu",
                                  iconColor: .orange,
                                  palette: palette
                              )

                              MetricBox(
                                  title: "Pin",
                                  value: reading.batteryTemperature,
                                  icon: "battery.100percent",
                                  iconColor: .yellow,
                                  palette: palette
                              )

                              MetricBox(
                                  title: "Bộ sạc",
                                  value: reading.chargerTemperature,
                                  icon: "powerplug.fill",
                                  iconColor: .orange,
                                  palette: palette
                              )

                              MetricBox(
                                  title: "Nóng nhất",
                                  value: reading.hottestTemperature,
                                  icon: "thermometer.high",
                                  iconColor: .red,
                                  palette: palette
                              )
                          }

                          HStack(spacing: 5) {
                              Circle()
                                  .fill(tint)
                                  .frame(width: 6, height: 6)

                              Text("Cập nhật")

                              Text("·")

                              Text(reading.date, style: .time)

                              Spacer()

                              Text(reading.hottestSensorName ?? "")
                                  .lineLimit(1)
                          }
                          .font(.system(size: 9, weight: .semibold))
                          .foregroundStyle(palette.muted)
                      }
                  } else {
                      NoReadingView(palette: palette)
                  }
              }
          }

          struct MetricBox: View {
              let title: String
              let value: Double?
              let icon: String
              let iconColor: Color
              let palette: WidgetPalette

              var body: some View {
                  VStack(alignment: .leading, spacing: 3) {

                      HStack(spacing: 3) {
                          Image(systemName: icon)
                              .font(.system(size: 9, weight: .semibold))
                              .foregroundStyle(iconColor)

                          Text(title)
                              .font(.system(size: 9, weight: .semibold))
                              .foregroundStyle(palette.muted)
                              .lineLimit(1)
                      }

                      Text(value.map { Formatting.temperature($0) } ?? "—")
                          .font(.system(size: 16, weight: .semibold, design: .rounded))
                          .monospacedDigit()
                          .foregroundStyle(.white)
                          .minimumScaleFactor(0.7)
                  }
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .padding(.horizontal, 7)
                  .padding(.vertical, 6)
                  .background(
                      RoundedRectangle(cornerRadius: 9, style: .continuous)
                          .fill(Color.white.opacity(0.06))
                  )
              }
          }

          '''

          pattern = r"struct MediumBatteryView: View \{.*?\nstruct LastChargeSummary: View \{"

          replacement = new_view + "struct LastChargeSummary: View {"

          result, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.S
          )

          if count != 1:
              raise SystemExit("Không tìm thấy MediumBatteryView")

          p.write_text(result)

          # ============================================================
          # 3. Vietnamese localization
          #    Áp dụng cho cả App và Widget / Lock Screen
          # ============================================================

          translations = {
              "Battery": "Pin",
              "Battery cell": "Cell pin",
              "Battery pack voltage": "Điện áp bộ pin",
              "Battery rail voltage": "Điện áp đường pin",
              "Camera": "Camera",
              "Charge IC": "IC sạc",
              "Charge IC die": "Nhiệt độ lõi IC sạc",
              "Charge IC junction": "Nhiệt độ mối nối IC sạc",
              "Charge power": "Công suất sạc",
              "Charge power and level, read from sensors": "Công suất sạc và mức pin, đọc từ cảm biến",
              "Charging": "Đang sạc",
              "Charging on hold": "Tạm dừng sạc",
              "Chassis": "Khung máy",
              "Current into battery": "Dòng vào pin",
              "Display": "Màn hình",
              "drawn from battery": "Đang dùng pin",
              "Finishing charge": "Đang hoàn tất sạc",
              "From app %@": "Từ ứng dụng %@",
              "at charging coil": "tại cuộn sạc",
              "at phone port": "tại cổng điện thoại",
              "Full": "Đầy",
              "into battery": "vào pin",
              "Last charge": "Lần sạc gần nhất",
              "Manufacturer": "Nhà sản xuất",
              "Model": "Mẫu máy",
              "Name": "Tên",
              "No reading": "Không có dữ liệu",
              "On battery": "Dùng pin",
              "Open MiniWatts once to resume": "Mở MiniWatts một lần để tiếp tục",
              "Other sensors": "Cảm biến khác",
              "Paused — open MiniWatts to resume": "Tạm dừng — mở MiniWatts để tiếp tục",
              "Plugged in, not charging": "Đã cắm nguồn, không sạc",
              "Radios": "Kết nối vô tuyến",
              "Since %@": "Từ %@",
              "SoC dies": "Chip SoC",
              "Source": "Nguồn",
              "Storage": "Bộ nhớ",
              "Updated %@": "Cập nhật %@",
              "USB-C": "USB-C",
              "USB-C input current": "Dòng vào USB-C",
              "USB-C input voltage": "Điện áp vào USB-C",
              "Watts": "Công suất",
              "Wireless": "Không dây",
              "Wireless coil": "Cuộn sạc không dây",
              "Wireless input current": "Dòng vào không dây",
              "Wireless input voltage": "Điện áp vào không dây",

              "Charging power": "Công suất sạc",
              "SoC temperature": "Nhiệt độ SoC",
              "Battery temperature": "Nhiệt độ pin",
              "Hottest component": "Thành phần nóng nhất",
              "Power": "Công suất",
              "SoC": "SoC",
              "Hottest": "Nóng nhất",
              "End": "Kết thúc",
              "End Live Activity": "Kết thúc hoạt động trực tiếp"
          }

          catalogs = [
              Path("MiniWatts/Localizable.xcstrings"),
              Path("Widget/Localizable.xcstrings")
          ]

          for catalog in catalogs:
              if not catalog.exists():
                  print(f"Không tìm thấy: {catalog}")
                  continue

              data = json.loads(catalog.read_text())

              strings = data.get("strings", {})

              for key, item in strings.items():
                  localizations = item.setdefault("localizations", {})

                  # Thêm tiếng Việt cho các chuỗi đã xác định
                  if key in translations:
                      localizations["vi"] = {
                          "stringUnit": {
                              "state": "translated",
                              "value": translations[key]
                          }
                      }

                  # Không cho bản Trung giản thể xuất hiện trong bản build này.
                  # Những chuỗi chưa dịch sẽ fallback về tiếng Anh thay vì tiếng Trung.
                  localizations.pop("zh-Hans", None)

              catalog.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n"
              )

              print(f"Đã patch: {catalog}")

      - name: Build IPA
        working-directory: source
        run: |
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: MiniWatts-Vietnamese-Widget
          path: source/build/export/MiniWatts-unsigned.ipa
          retention-days: 14